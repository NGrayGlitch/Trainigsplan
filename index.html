<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zufallsgenerator mit Start-Timer und Sound</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
        }
        #start {
            font-size: 2em;
            padding: 20px 40px;
        }
        #startTimer, #timer {
            font-size: 2em;
            margin-top: 20px;
        }
        #richtung {
            font-size: 2em;
            margin-top: 40px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Zufallsgenerator</h1>
    <button id="start">Start</button>
    <div id="startTimer"></div>
    <div id="timer"></div>
    <div id="richtung"></div>

    <!-- Sounddateien -->
    <audio id="sound-links" src="./sounds/links.speech.mp3"></audio>
    <audio id="sound-rechts" src="./sounds/rechts.speech.mp3"></audio>
    <audio id="sound-fertig" src="./sounds/fertig.speech.mp3"></audio>

    <script>
        const startBtn = document.getElementById("start");
        const startTimerDiv = document.getElementById("startTimer");
        const timerDiv = document.getElementById("timer");
        const richtungDiv = document.getElementById("richtung");

        const soundLinks = document.getElementById("sound-links");
        const soundRechts = document.getElementById("sound-rechts");
        const soundFertig = document.getElementById("sound-fertig");

        let intervalId;
        let countdown;
        let lastRichtung = "";

        startBtn.addEventListener("click", () => {
            startBtn.disabled = true;
            startTimerDiv.innerText = "Start in 5s...";
            let startCountdown = 5;

            // 5-Sekunden Start-Timer
            const startInterval = setInterval(() => {
                startCountdown--;
                if (startCountdown > 0) {
                    startTimerDiv.innerText = `Start in ${startCountdown}s...`;
                } else {
                    clearInterval(startInterval);
                    startTimerDiv.innerText = "";
                    starteZufallsgenerator();
                }
            }, 1000);

            function starteZufallsgenerator() {
                countdown = 30;
                timerDiv.innerText = `Timer: ${countdown}s`;

                // 30-Sekunden Timer
                const timerInterval = setInterval(() => {
                    countdown--;
                    timerDiv.innerText = `Timer: ${countdown}s`;
                    if (countdown <= 0) {
                        clearInterval(timerInterval);
                        clearTimeout(intervalId);
                        richtungDiv.innerText = "Fertig!";
                        soundFertig.currentTime = 0;
                        soundFertig.play();
                        startBtn.disabled = false;
                        lastRichtung = "";
                    }
                }, 1000);

                // Richtungswechsel
                function wechselRichtung() {
                    let richtung;
                    do {
                        richtung = Math.random() < 0.5 ? "Links" : "Rechts";
                    } while (richtung === lastRichtung);

                    lastRichtung = richtung;
                    richtungDiv.innerText = richtung;

                    // Sound abspielen
                    if (richtung === "Links") {
                        soundLinks.currentTime = 0;
                        soundLinks.play();
                    } else {
                        soundRechts.currentTime = 0;
                        soundRechts.play();
                    }

                    // Zufälliges Intervall 2–5 Sekunden
                    const zufallIntervall = 2000 + Math.random() * 3000;
                    intervalId = setTimeout(wechselRichtung, zufallIntervall);
                }

                wechselRichtung(); // ersten Wechsel starten
            }
        });
    </script>

</body>
</html>
